# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # app.club_starting_balance WAS HERE AND WAS DEAD. It resolved %env(int:CLUB_STARTING_BALANCE)%
    # and had exactly one occurrence in the repository — its own declaration. Nothing injected it
    # and nothing read it, while StarterConfig::$startingBalance (admin-editable, in pence) was
    # and remains the real and only source. Two costs to leaving it: changing the
    # CLUB_STARTING_BALANCE deploy secret appeared to do something and did nothing, and because
    # the parameter required the env var, dropping that var from a deploy would have failed the
    # container's boot for a value no code consumed.
    #
    # CLUB_STARTING_BALANCE is still set in both compose files, both deploy workflows and
    # docs/deploy/hetzner.md. Those are now harmless but equally pointless — removing them is a
    # deploy-config change and deliberately left as a separate decision.
    app.leaderboard_cache_ttl: '%env(int:LEADERBOARD_CACHE_TTL)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # Pluggable competition match engines (DeterministicEngine, AiEngineStub) — tagged so
    # MatchEngineRegistry can iterate and dispatch by MatchEngineIdentifier::supports().
    _instanceof:
        App\Service\MatchEngine\MatchEngineInterface:
            tags: ['app.match_engine']

    App\Service\MatchEngine\MatchEngineRegistry:
        arguments:
            $engines: !tagged_iterator app.match_engine

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # $debug decides whether a 5xx detail carries the real exception message.
    App\EventSubscriber\ApiExceptionSubscriber:
        arguments:
            $debug: '%kernel.debug%'

    App\Service\EmailVerificationService:
        arguments:
            $mailerFrom: '%env(MAILER_FROM)%'
            $mailerFromName: '%env(MAILER_FROM_NAME)%'
            $appUrl: '%env(APP_URL)%'
            $betaInviteMailerFrom: '%env(BETA_INVITE_MAILER_FROM)%'

    App\Service\TokenEncryptionService:
        arguments:
            $socialTokenEncryptionKey: '%env(SOCIAL_TOKEN_ENCRYPTION_KEY)%'

    # Which AI provider supplies location geography (coordinates, population, land value).
    #
    # The provider is a deliberately open decision, so everything above this line is written
    # against LocationEnricherInterface and names no vendor. UnconfiguredLocationEnricher is
    # the default and REFUSES LOUDLY: it throws EnrichmentUnavailableException, which lands as
    # an outcome=error LocationEnrichmentAttempt row and shows as not-ok on the admin
    # connection check. That is on purpose — a missing FIREBASE_SERVICE_ACCOUNT_JSON once
    # discarded every push notification in this codebase with no trace at all, and an
    # unconfigured enricher must be visible BEFORE someone starts an 865-row sweep.
    #
    # To wire a real provider: implement the interface and repoint this alias. Nothing else in
    # the feature needs to change.
    # Chosen by LOCATION_ENRICHER_PROVIDER at runtime via a factory, NOT an alias: a service
    # alias needs a concrete id at compile time, so `alias: '%env(...)%'` does not compile.
    # The factory falls back to UnconfiguredLocationEnricher for anything it does not
    # recognise, or when the key or model is missing — and logs which of those it was.
    App\Service\Location\Enrichment\LocationEnricherInterface:
        factory: ['@App\Service\Location\Enrichment\LocationEnricherFactory', 'create']

    App\Service\Location\Enrichment\LocationEnricherFactory:
        arguments:
            $provider: '%env(string:LOCATION_ENRICHER_PROVIDER)%'
            $apiKey: '%env(string:LOCATION_ENRICHER_API_KEY)%'
            $model: '%env(string:LOCATION_ENRICHER_MODEL)%'

    # Credentials come from env, never from the database. The admin panel is a much broader
    # surface than a deploy secret, and a key in a DB column also lands in every backup and in
    # the config export that admins are told is safe to commit. This follows
    # FIREBASE_SERVICE_ACCOUNT_JSON, the only other external credential in this codebase.
    #
    # Registered unconditionally, even when no key is set: the alias above decides which
    # implementation is USED, and a service that is defined but unused costs nothing, while a
    # conditionally-defined one would break container compilation the moment the alias pointed
    # at it.
    # The one place the Anthropic credentials are bound. Both callers — location enrichment
    # and town suggestion — share this client and therefore share the key, which is what
    # "use the existing API key" means in practice.
    App\Service\Ai\AnthropicJsonClient:
        arguments:
            $apiKey: '%env(string:LOCATION_ENRICHER_API_KEY)%'
            $model: '%env(string:LOCATION_ENRICHER_MODEL)%'

    App\Service\Location\Suggestion\TownSuggesterInterface:
        factory: ['@App\Service\Location\Suggestion\TownSuggesterFactory', 'create']

    App\Service\Location\Suggestion\TownSuggesterFactory:
        arguments:
            $provider: '%env(string:LOCATION_ENRICHER_PROVIDER)%'
            $apiKey: '%env(string:LOCATION_ENRICHER_API_KEY)%'
            $model: '%env(string:LOCATION_ENRICHER_MODEL)%'

    # Country-level enrichment: the bounding box and land band that EnrichmentValidator checks
    # every town answer against, plus the profile's reference metadata. Same factory-not-alias
    # reasoning as above, and deliberately the SAME three variables — one provider, one key,
    # one model for everything in this feature.
    App\Service\Location\CountryEnrichment\CountryProfileEnricherInterface:
        factory: ['@App\Service\Location\CountryEnrichment\CountryProfileEnricherFactory', 'create']

    App\Service\Location\CountryEnrichment\CountryProfileEnricherFactory:
        arguments:
            $provider: '%env(string:LOCATION_ENRICHER_PROVIDER)%'
            $apiKey: '%env(string:LOCATION_ENRICHER_API_KEY)%'
            $model: '%env(string:LOCATION_ENRICHER_MODEL)%'

    # Club-naming content (suffixes and stadium templates), authored from the locations
    # dashboard. Same three variables again, for the same reason.
    App\Service\CountryContent\Suggestion\NamingContentSuggesterInterface:
        factory: ['@App\Service\CountryContent\Suggestion\NamingContentSuggesterFactory', 'create']

    App\Service\CountryContent\Suggestion\NamingContentSuggesterFactory:
        arguments:
            $provider: '%env(string:LOCATION_ENRICHER_PROVIDER)%'
            $apiKey: '%env(string:LOCATION_ENRICHER_API_KEY)%'
            $model: '%env(string:LOCATION_ENRICHER_MODEL)%'

    App\Controller\Admin\SocialAuthController:
        arguments:
            $facebookAppId: '%env(FACEBOOK_APP_ID)%'
            $facebookAppSecret: '%env(FACEBOOK_APP_SECRET)%'
            $facebookRedirectUri: '%env(FACEBOOK_REDIRECT_URI)%'
            $twitterClientId: '%env(TWITTER_CLIENT_ID)%'
            $twitterClientSecret: '%env(TWITTER_CLIENT_SECRET)%'
            $twitterRedirectUri: '%env(TWITTER_REDIRECT_URI)%'

    App\Security\VerificationAwareAuthenticationSuccessHandler:
        arguments:
            $decorated: '@lexik_jwt_authentication.handler.authentication_success'

    App\Service\LeaderboardCalculationService:
        arguments:
            $leaderboardCache: '@app.leaderboard_cache'
            $leaderboardCacheTtl: '%app.leaderboard_cache_ttl%'

    App\Service\FacilityImageResolver:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # Built directly from the raw service-account JSON rather than kreait/firebase-bundle's
    # own config binding — see FirebaseMessagingFactory's docblock.
    Kreait\Firebase\Contract\Messaging:
        factory: ['App\Service\Notification\FirebaseMessagingFactory', 'create']
        arguments:
            $serviceAccountJson: '%env(FIREBASE_SERVICE_ACCOUNT_JSON)%'

    # Deliberately takes the raw env value directly (not the `Messaging` service above) —
    # FirebaseConnectionValidator needs to catch a construction failure itself as its first
    # check, so it can't depend on a service that's already failed to construct.
    App\Service\Notification\FirebaseConnectionValidator:
        arguments:
            $serviceAccountJson: '%env(FIREBASE_SERVICE_ACCOUNT_JSON)%'
