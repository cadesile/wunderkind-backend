# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.club_starting_balance: '%env(int:CLUB_STARTING_BALANCE)%'
    app.leaderboard_cache_ttl: '%env(int:LEADERBOARD_CACHE_TTL)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Service\EmailVerificationService:
        arguments:
            $mailerFrom: '%env(MAILER_FROM)%'
            $mailerFromName: '%env(MAILER_FROM_NAME)%'
            $appUrl: '%env(APP_URL)%'

    App\Service\TokenEncryptionService:
        arguments:
            $socialTokenEncryptionKey: '%env(SOCIAL_TOKEN_ENCRYPTION_KEY)%'

    App\Controller\Admin\SocialAuthController:
        arguments:
            $facebookAppId: '%env(FACEBOOK_APP_ID)%'
            $facebookAppSecret: '%env(FACEBOOK_APP_SECRET)%'
            $facebookRedirectUri: '%env(FACEBOOK_REDIRECT_URI)%'
            $twitterClientId: '%env(TWITTER_CLIENT_ID)%'
            $twitterClientSecret: '%env(TWITTER_CLIENT_SECRET)%'
            $twitterRedirectUri: '%env(TWITTER_REDIRECT_URI)%'

    App\Security\VerificationAwareAuthenticationSuccessHandler:
        arguments:
            $decorated: '@lexik_jwt_authentication.handler.authentication_success'

    App\Service\LeaderboardCalculationService:
        arguments:
            $leaderboardCache: '@app.leaderboard_cache'
            $leaderboardCacheTtl: '%app.leaderboard_cache_ttl%'
