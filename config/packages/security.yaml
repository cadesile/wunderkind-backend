security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
        app_admin_provider:
            entity:
                class: App\Entity\Admin
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        admin:
            pattern: ^/admin
            lazy: true
            provider: app_admin_provider
            form_login:
                login_path: admin_login
                check_path: admin_login
                default_target_path: /admin
            logout:
                path: admin_logout
                target: admin_login

        login:
            pattern: ^/api/login
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: /api/login
                username_path: email
                success_handler: App\Security\VerificationAwareAuthenticationSuccessHandler
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        refresh_token:
            pattern: ^/api/token/refresh
            stateless: true
            provider: app_user_provider
            refresh_jwt:
                check_path: /api/token/refresh

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        # Allow CORS preflight requests through without JWT authentication.
        # NelmioCorsBundle handles OPTIONS and returns the correct headers.
        - { path: ^/api, roles: PUBLIC_ACCESS, methods: [OPTIONS] }
        - { path: ^/admin/login,       roles: PUBLIC_ACCESS }
        - { path: ^/admin,             roles: ROLE_ADMIN }
        - { path: ^/api/login,         roles: PUBLIC_ACCESS }
        - { path: ^/api/token/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/register,              roles: PUBLIC_ACCESS }
        - { path: ^/api/verify-email,          roles: PUBLIC_ACCESS }
        - { path: ^/api/resend-verification,   roles: PUBLIC_ACCESS }
        - { path: ^/api/forgot-password,       roles: PUBLIC_ACCESS }
        - { path: ^/api/reset-password,        roles: PUBLIC_ACCESS }
        - { path: ^/api/resend-password-reset, roles: PUBLIC_ACCESS }
        - { path: ^/api/club/name-options,        roles: PUBLIC_ACCESS }
        - { path: ^/api/club/foreign,            roles: PUBLIC_ACCESS }
        - { path: ^/api/scout/foreign-clubs,     roles: PUBLIC_ACCESS }
        - { path: ^/api/leaderboard, roles: PUBLIC_ACCESS }
        - { path: ^/api/stats,                 roles: PUBLIC_ACCESS }
        - { path: ^/api/app-links,             roles: PUBLIC_ACCESS }
        - { path: ^/api/game-config,           roles: PUBLIC_ACCESS }
        - { path: ^/api/starter-config,        roles: PUBLIC_ACCESS }
        - { path: ^/api/archetypes,            roles: PUBLIC_ACCESS }
        - { path: ^/api/excursions,            roles: PUBLIC_ACCESS }
        - { path: ^/api/beta-request,          roles: PUBLIC_ACCESS }
        - { path: ^/api/admin/,   roles: ROLE_ADMIN }
        - { path: ^/api/pool,             roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/sync,             roles: ROLE_CLUB }
        - { path: ^/api/market/data,     roles: ROLE_CLUB }
        - { path: ^/api/market/assign,   roles: ROLE_CLUB }
        - { path: ^/api/club/,        roles: ROLE_CLUB }
        - { path: ^/api/inbox,           roles: ROLE_CLUB }
        - { path: ^/api/messages,        roles: ROLE_CLUB }
        - { path: ^/api/finance/,        roles: ROLE_CLUB }
        - { path: ^/api/events/,         roles: ROLE_CLUB }
        - { path: ^/api/squad,           roles: ROLE_CLUB }
        - { path: ^/api/staff,           roles: ROLE_CLUB }
        - { path: ^/api/facilities,      roles: ROLE_CLUB }
        - { path: ^/api/initialize,      roles: ROLE_CLUB }
        - { path: ^/api,                 roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
