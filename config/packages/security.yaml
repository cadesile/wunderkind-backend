security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
        app_admin_provider:
            entity:
                class: App\Entity\Admin
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        admin:
            pattern: ^/admin
            lazy: true
            provider: app_admin_provider
            form_login:
                login_path: admin_login
                check_path: admin_login
                default_target_path: /admin
            logout:
                path: admin_logout
                target: admin_login

        login:
            pattern: ^/api/login
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: /api/login
                username_path: email
                success_handler: App\Security\VerificationAwareAuthenticationSuccessHandler
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        refresh_token:
            pattern: ^/api/token/refresh
            stateless: true
            provider: app_user_provider
            refresh_jwt:
                check_path: /api/token/refresh

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        # Allow CORS preflight requests through without JWT authentication.
        # NelmioCorsBundle handles OPTIONS and returns the correct headers.
        - { path: ^/api, roles: PUBLIC_ACCESS, methods: [OPTIONS] }
        - { path: ^/admin/login,       roles: PUBLIC_ACCESS }
        - { path: ^/admin,             roles: ROLE_ADMIN }
        - { path: ^/api/login,         roles: PUBLIC_ACCESS }
        - { path: ^/api/token/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/register,              roles: PUBLIC_ACCESS }
        - { path: ^/api/verify-email,          roles: PUBLIC_ACCESS }
        - { path: ^/api/resend-verification,   roles: PUBLIC_ACCESS }
        - { path: ^/api/forgot-password,       roles: PUBLIC_ACCESS }
        - { path: ^/api/reset-password,        roles: PUBLIC_ACCESS }
        - { path: ^/api/resend-password-reset, roles: PUBLIC_ACCESS }
        - { path: ^/api/club/name-options,        roles: PUBLIC_ACCESS }
        - { path: ^/api/club/foreign,            roles: PUBLIC_ACCESS }
        - { path: ^/api/scout/foreign-clubs,     roles: PUBLIC_ACCESS }
        - { path: ^/api/leaderboard, roles: PUBLIC_ACCESS }
        - { path: ^/api/stats,                 roles: PUBLIC_ACCESS }
        - { path: ^/api/app-links,             roles: PUBLIC_ACCESS }
        - { path: ^/api/game-config,           roles: PUBLIC_ACCESS }
        - { path: ^/api/starter-config,        roles: PUBLIC_ACCESS }
        - { path: ^/api/countries,             roles: PUBLIC_ACCESS }
        - { path: ^/api/telemetry,             roles: PUBLIC_ACCESS }
        - { path: ^/api/archetypes,            roles: PUBLIC_ACCESS }
        - { path: ^/api/excursions,            roles: PUBLIC_ACCESS }
        - { path: ^/api/languages,             roles: PUBLIC_ACCESS }
        - { path: ^/api/translations,          roles: PUBLIC_ACCESS }
        # The land catalogue. Public because a player browses towns before signing in,
        # and the list carries no per-account data unless ?affordability=1 is passed —
        # which the controller then serves against a zero balance for an anonymous
        # caller, so there is nothing here to leak. Sits with the other PUBLIC_ACCESS
        # read endpoints and AHEAD of the ^/api catch-all, which would otherwise demand
        # authentication. Note ^/api/plots below is the WRITE side and stays private.
        - { path: ^/api/locations,             roles: PUBLIC_ACCESS }
        - { path: ^/api/beta-request,          roles: PUBLIC_ACCESS }
        # Land plots: holding, claiming and building a ground.
        #
        # IS_AUTHENTICATED_FULLY, deliberately NOT ROLE_CLUB. Land can be bought before a club
        # exists, and User::getRoles() appends ROLE_CLUB unconditionally — so a ROLE_CLUB gate
        # here would appear to work in testing and break the day that is corrected. That is the
        # /api/club/check lockout, verbatim; see docs/api/role-club-403.md.
        #
        # Listed explicitly even though the ^/api catch-all already grants exactly this, so that
        # a future narrower rule (an admin-only /api/plots/... say) has an anchor to be ordered
        # AHEAD of. First match wins, and that ordering is load-bearing.
        - { path: ^/api/plots,                 roles: IS_AUTHENTICATED_FULLY }
        # Browser-reachable account deletion (Google Play / iOS requirement).
        # Narrower than ^/api/account/delete, which stays JWT-only.
        - { path: ^/api/account/delete-request, roles: PUBLIC_ACCESS }
        - { path: ^/api/world/overview,        roles: PUBLIC_ACCESS }
        - { path: ^/api/videos,                roles: PUBLIC_ACCESS }
        # Bracket/results data has no sensitive info (like /api/archetypes) — public so
        # the web landing page can hit it directly. Order matters: register/resubmit/withdraw
        # below must be listed (or otherwise anchored) before this, since PUBLIC_ACCESS
        # here is `$`-anchored to the bare /{id} path and won't match their longer paths.
        - { path: ^/api/competitions$,                   roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/competitions/available,          roles: PUBLIC_ACCESS }
        - { path: ^/api/competitions/active,             roles: PUBLIC_ACCESS }
        - { path: ^/api/competitions/champions,          roles: PUBLIC_ACCESS }
        - { path: ^/api/competitions/[^/]+$,             roles: PUBLIC_ACCESS }
        - { path: ^/api/matches/[^/]+$,                  roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/friendlies/challenges$,          roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/admin/,   roles: ROLE_ADMIN }
        - { path: ^/api/pool,             roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/sync,             roles: ROLE_CLUB }
        - { path: ^/api/competitions/[^/]+/(register|resubmit|withdraw)$, roles: ROLE_CLUB }
        - { path: ^/api/friendlies/,     roles: ROLE_CLUB }
        - { path: ^/api/market/data,     roles: ROLE_CLUB }
        - { path: ^/api/market/assign,   roles: ROLE_CLUB }
        # Authentication-only, and it must stay ahead of ^/api/club/ below (first match wins).
        # The whole question this endpoint answers is "does this account have a club?", which an
        # account that has none has to be able to ask — gating it on ROLE_CLUB would be fine, but
        # gating it on a role a brand-new account might not carry made its own 404 branch
        # unreachable and answered 403 instead. The client reads 404 as "no club yet" and
        # anything else as "the server refused this account", so the two are not interchangeable.
        # See docs/api/role-club-403.md.
        - { path: ^/api/club/check$, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/club/,        roles: ROLE_CLUB }
        - { path: ^/api/inbox,           roles: ROLE_CLUB }
        - { path: ^/api/messages,        roles: ROLE_CLUB }
        - { path: ^/api/finance/,        roles: ROLE_CLUB }
        - { path: ^/api/events/,         roles: ROLE_CLUB }
        - { path: ^/api/squad,           roles: ROLE_CLUB }
        - { path: ^/api/staff,           roles: ROLE_CLUB }
        - { path: ^/api/facilities,      roles: ROLE_CLUB }
        - { path: ^/api/initialize,      roles: ROLE_CLUB }
        - { path: ^/api,                 roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
