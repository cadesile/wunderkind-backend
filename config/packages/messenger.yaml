framework:
    messenger:
        # A failure here is also always recorded in NotificationLog (see
        # NotificationLoggingSubscriber) for visibility — this transport is for *recovery*: a
        # legitimately transient failure (FCM briefly unreachable, say) becomes retryable by
        # hand via `messenger:failed:retry` instead of being discarded after Symfony's default
        # retry attempts.
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            # `auto_setup=1` on the DSN (.env) creates the Doctrine transport table on first
            # dispatch — no separate messenger:setup-transports deploy step needed, though it
            # remains safe (idempotent) to run by hand.
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            # Same underlying `messenger_messages` table as `async` — Doctrine transports are
            # differentiated by `queue_name`, not by table, so this needs no separate migration.
            failed: 'doctrine://default?queue_name=failed'
            # Deliberately separate from `async`: World Pack Cache regeneration can queue 100+
            # club-generation messages per country, each doing real DB-heavy generation work.
            # Sharing one queue with push notifications meant a large regenerate (or a backlog
            # of failing/retrying push sends) delayed the other — drained by its own consumer
            # (docker/worldpack-consume.sh), not messenger-consume.sh, so the two make
            # independent progress. See docs/deploy/hetzner.md's Cron section.
            worldpack: 'doctrine://default?queue_name=worldpack'
            # Pool top-ups queued by `app:starter-pool:audit` — separate from `worldpack`
            # for the same reason `worldpack` is separate from `async`: a sweep across 25
            # enabled countries can queue hundreds of generation chunks, and sharing the
            # worldpack queue would put a routine overnight top-up in front of an admin
            # sitting and waiting on a country regenerate. Drained by
            # docker/pool-consume.sh. StarterPoolAuditService::TRANSPORT_QUEUE must match
            # this queue_name — it counts undrained rows to avoid stacking sweeps.
            pool: 'doctrine://default?queue_name=pool'
            # Competition round processing queued by competition-draw-rounds.sh and
            # competition-resolve-rounds.sh. Its own transport for the same reason `pool` and
            # `worldpack` have theirs: resolving one round runs the match engine and narrative
            # generation for up to 32 fixtures, and a round must not wait behind an overnight
            # pool top-up or an admin-triggered country regenerate. Drained by
            # docker/competition-consume.sh.
            #
            # Round processing is latency-sensitive in a way the other queues are not — a
            # tournament's next round is scheduled against wall-clock time, so a backlog here
            # is visible to players as a late draw rather than as a slow background job.
            competition: 'doctrine://default?queue_name=competition'

        routing:
            # Push notifications — see src/Service/Notification/PushNotificationService.php.
            'App\Message\SendPushNotificationMessage': async
            'App\Message\ResolveAdminMessageAudienceForPushMessage': async
            'App\Message\ResolveNewCompetitionAudienceForPushMessage': async
            # Admin-triggered World Pack Cache regeneration — see WorldPackGenerationOrchestrator.
            # Own transport (`worldpack`, not `async`) — see the transport comment above.
            'App\Message\WorldPack\WarmWorldPackTierMessage': worldpack
            'App\Message\WorldPack\WarmWorldPackClubMessage': worldpack
            # Cron-queued starter pool top-ups — see StarterPoolAuditService.
            'App\Message\Pool\TopUpStarterPoolMessage': pool
            # Cron-queued competition round processing — see CompetitionDrawService and
            # CompetitionResultsService. Each message carries only a round id; the handler
            # re-reads the round and takes the claim, so a duplicate dispatch is a no-op.
            'App\Message\Competition\DrawCompetitionRoundMessage': competition
            'App\Message\Competition\ResolveCompetitionRoundMessage': competition

when@test:
    framework:
        messenger:
            transports:
                # In-memory transport for functional tests — dispatched envelopes are
                # inspected via InMemoryTransport::getSent() instead of a real consumer.
                async: 'in-memory://'
                failed: 'in-memory://'
                worldpack: 'in-memory://'
                pool: 'in-memory://'
                competition: 'in-memory://'
