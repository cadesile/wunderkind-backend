name: Deploy Staging

on:
  workflow_dispatch: # Staging deployment dormant — trigger manually only

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/cadesile/wunderkind-backend:stage

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: docker-compose.staging.yml
          target: /mnt/volume-wkf/wunderkind/staging/

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            cd /mnt/volume-wkf/wunderkind/staging

            cat > .env <<EOF
            DB_PASSWORD=${{ secrets.STAGE_DB_PASSWORD }}
            APP_SECRET=${{ secrets.STAGE_APP_SECRET }}
            CORS_ALLOW_ORIGIN=${{ secrets.STAGE_CORS_ALLOW_ORIGIN }}
            CLUB_STARTING_BALANCE=${{ secrets.STAGE_CLUB_STARTING_BALANCE }}
            JWT_SECRET_KEY="${{ secrets.STAGE_JWT_SECRET_KEY }}"
            JWT_PUBLIC_KEY="${{ secrets.STAGE_JWT_PUBLIC_KEY }}"
            MAILER_DSN=${{ secrets.STAGE_MAILER_DSN }}
            MAILER_FROM=${{ secrets.STAGE_MAILER_FROM }}
            MAILER_FROM_NAME="${{ secrets.STAGE_MAILER_FROM_NAME }}"
            SOCIAL_TOKEN_ENCRYPTION_KEY="${{ secrets.STAGE_SOCIAL_TOKEN_ENCRYPTION_KEY }}"
            FACEBOOK_APP_ID="${{ secrets.STAGE_FACEBOOK_APP_ID }}"
            FACEBOOK_APP_SECRET="${{ secrets.STAGE_FACEBOOK_APP_SECRET }}"
            FACEBOOK_REDIRECT_URI="${{ secrets.STAGE_FACEBOOK_REDIRECT_URI }}"
            TWITTER_CLIENT_ID="${{ secrets.STAGE_TWITTER_CLIENT_ID }}"
            TWITTER_CLIENT_SECRET="${{ secrets.STAGE_TWITTER_CLIENT_SECRET }}"
            TWITTER_REDIRECT_URI="${{ secrets.STAGE_TWITTER_REDIRECT_URI }}"
            EOF

            docker compose -f docker-compose.staging.yml pull
            docker compose -f docker-compose.staging.yml up -d
            docker compose -f docker-compose.staging.yml exec -T app \
              php bin/console doctrine:migrations:migrate --no-interaction
            # Staging ran no seeders at all, so /api/archetypes served an empty catalogue.
            # Truncates and reseeds — safe to re-run.
            docker compose -f docker-compose.staging.yml exec -T app \
              php bin/console app:seed-archetypes
            docker compose -f docker-compose.staging.yml exec -T app \
              php bin/console assets:install --symlink
            docker compose -f docker-compose.staging.yml exec -T app \
              php bin/console cache:clear
            docker image prune -a -f --filter "until=24h"
