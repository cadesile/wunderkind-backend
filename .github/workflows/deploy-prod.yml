name: Deploy Production

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/cadesile/wunderkind-backend:prod

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /mnt/volume-wkf/wunderkind/prod/

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            cd /mnt/volume-wkf/wunderkind/prod

            cat > .env <<EOF
            DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}
            APP_SECRET=${{ secrets.PROD_APP_SECRET }}
            CORS_ALLOW_ORIGIN=${{ secrets.PROD_CORS_ALLOW_ORIGIN }}
            CLUB_STARTING_BALANCE=${{ secrets.PROD_CLUB_STARTING_BALANCE }}
            JWT_SECRET_KEY="${{ secrets.PROD_JWT_SECRET_KEY }}"
            JWT_PUBLIC_KEY="${{ secrets.PROD_JWT_PUBLIC_KEY }}"
            MAILER_DSN="${{ secrets.PROD_MAILER_DSN }}"
            MAILER_FROM="${{ secrets.PROD_MAILER_FROM }}"
            MAILER_FROM_NAME="${{ secrets.PROD_MAILER_FROM_NAME }}"
            SOCIAL_TOKEN_ENCRYPTION_KEY="${{ secrets.PROD_SOCIAL_TOKEN_ENCRYPTION_KEY }}"
            FACEBOOK_APP_ID="${{ secrets.PROD_FACEBOOK_APP_ID }}"
            FACEBOOK_APP_SECRET="${{ secrets.PROD_FACEBOOK_APP_SECRET }}"
            FACEBOOK_REDIRECT_URI="${{ secrets.PROD_FACEBOOK_REDIRECT_URI }}"
            TWITTER_CLIENT_ID="${{ secrets.PROD_TWITTER_CLIENT_ID }}"
            TWITTER_CLIENT_SECRET="${{ secrets.PROD_TWITTER_CLIENT_SECRET }}"
            TWITTER_REDIRECT_URI="${{ secrets.PROD_TWITTER_REDIRECT_URI }}"
            EOF
            sed -i 's/^[[:space:]]*//' .env

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml exec -T app \
              php bin/console doctrine:migrations:migrate --no-interaction
            docker compose -f docker-compose.prod.yml exec -T app \
              php bin/console app:seed-player-events
            docker compose -f docker-compose.prod.yml exec -T app \
              php bin/console app:seed-social-post-templates
            # Upserts the excursion catalogue by slug — safe to re-run, and
            # preserves artwork uploaded through the admin.
            docker compose -f docker-compose.prod.yml exec -T app \
              php bin/console app:seed-excursions
            # Fills `appearance` for any Player/Staff/Scout/Agent row that lacks
            # one. Touches only rows WHERE appearance IS NULL, so it is cheap on
            # every deploy. It does NOT re-weight existing avatars by world
            # region — that is `--regenerate-skin-tone`, a one-time full-table
            # pass deliberately kept out of the deploy (see CLAUDE.md).
            docker compose -f docker-compose.prod.yml exec -T app \
              php bin/console app:backfill-appearances
            docker compose -f docker-compose.prod.yml exec -T app \
              php bin/console assets:install --symlink
            docker compose -f docker-compose.prod.yml exec -T app \
              php bin/console cache:clear
            docker image prune -a -f --filter "until=24h"
