; Loaded into /usr/local/etc/php/conf.d/ by the Dockerfile. Named with a `zz-` prefix so
; it sorts after the base image's own docker-*.ini files and therefore wins on any key
; they also set.
;
; Keep this file to settings that must apply to the deployed container specifically.
; Anything that belongs to the application's behaviour belongs in Symfony config, and
; anything needed for local dev belongs in Lando's own php.ini (Lando does not read this
; file — it boots a devwithlando image, not this one, so a setting added here will NOT
; show up in `lando php`).

; Suppress the `X-Powered-By: PHP/8.5.12` response header. It disclosed the exact patch
; version on every single response, turning "which PHP are they on?" from a probe into a
; free lookup for anyone matching the next CVE against us. No functional effect.
expose_php = Off
