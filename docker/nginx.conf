# The app container serves plain HTTP only. TLS is terminated by the host-level
# Caddy reverse proxy (deploy/proxy/Caddyfile), which is the only thing binding
# host ports 80/443. This config is hostname-agnostic on purpose — the same image
# runs prod and dev, and Caddy decides which container a hostname reaches.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # NOTE: deliberately no ngx_http_realip_module config here. Rewriting
    # $remote_addr to the original client would put a PUBLIC IP in REMOTE_ADDR,
    # which then fails Symfony's `trusted_proxies: private_ranges` check — so
    # Symfony would silently ignore X-Forwarded-Proto and emit http:// URLs,
    # breaking the admin login redirect. Let REMOTE_ADDR stay the Caddy container's
    # private bridge address and let Symfony resolve the real client from
    # X-Forwarded-For itself.

    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php;

        location / {
            try_files $uri /index.php$is_args$args;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            internal;
        }

        location ~ \.php$ {
            return 404;
        }
    }
}
