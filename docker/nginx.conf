worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # HTTP → HTTPS redirect (also serves ACME challenges for cert issuance)
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS — api.buildmyclub.co.uk
    server {
        listen 443 ssl;
        server_name api.buildmyclub.co.uk;
        root /var/www/html/public;
        index index.php;

        ssl_certificate     /etc/letsencrypt/live/api.buildmyclub.co.uk/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.buildmyclub.co.uk/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            try_files $uri /index.php$is_args$args;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            internal;
        }

        location ~ \.php$ {
            return 404;
        }
    }

    # HTTPS — www.buildmyclub.co.uk
    server {
        listen 443 ssl;
        server_name www.buildmyclub.co.uk;
        root /var/www/html/public;
        index index.php;

        ssl_certificate     /etc/letsencrypt/live/www.buildmyclub.co.uk/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.buildmyclub.co.uk/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            try_files $uri /index.php$is_args$args;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            internal;
        }

        location ~ \.php$ {
            return 404;
        }
    }
}
