# The app container serves plain HTTP only. TLS is terminated by the host-level
# Caddy reverse proxy (deploy/proxy/Caddyfile), which is the only thing binding
# host ports 80/443. This config is hostname-agnostic on purpose — the same image
# runs prod and dev, and Caddy decides which container a hostname reaches.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Don't advertise the exact nginx build. Responses previously carried
    # `Server: nginx/1.30.4`, which hands anyone the precise version to match against
    # the next advisory instead of having to probe for it. This is the only knob core
    # nginx offers — it reduces the header to a bare `Server: nginx` rather than
    # removing it; dropping it entirely needs the third-party headers-more module,
    # which isn't worth adding a build dependency for.
    server_tokens off;

    # Default (1m) is too tight for a full season's worth of sync/conclude-season archive
    # data (fixtures/relationships/promises/excursions, seasonLeaders/seasonFixtures) —
    # explicit headroom rather than relying on the compiled-in default silently.
    client_max_body_size 5m;

    # NOTE: deliberately no ngx_http_realip_module config here. Rewriting
    # $remote_addr to the original client would put a PUBLIC IP in REMOTE_ADDR,
    # which then fails Symfony's `trusted_proxies: private_ranges` check — so
    # Symfony would silently ignore X-Forwarded-Proto and emit http:// URLs,
    # breaking the admin login redirect. Let REMOTE_ADDR stay the Caddy container's
    # private bridge address and let Symfony resolve the real client from
    # X-Forwarded-For itself.

    server {
        listen 80;
        server_name _;
        root /var/www/html/public;
        index index.php;

        location / {
            try_files $uri /index.php$is_args$args;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            internal;
        }

        location ~ \.php$ {
            return 404;
        }
    }
}
