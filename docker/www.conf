; PHP-FPM pool sizing.
;
; This file exists because the image default is pm.max_children = 5 — a hard ceiling of five
; concurrent PHP requests for the ENTIRE API. Not five registrations: five requests, total,
; shared with /api/sync, /api/club/status and everything else. A burst of tournament
; registrations was therefore an outage for every other endpoint, not a slow queue.
;
; Sizing is from the actual box, not a rule of thumb. It is a 2 vCPU / 3.8 GB Hetzner server
; that also hosts the dev stack: wunderkind-prod, wunderkind-dev, postgres-prod, postgres-dev
; and caddy. Measured steady-state usage is ~456 MB total, so memory is not the binding
; constraint — CPU is.
;
; - pm.max_children = 12. PHP here is CPU-bound (a 1.4MB registration is ~22ms of pure JSON
;   work), and on 2 cores more runnable workers buy context switches rather than throughput.
;   12 is ~6x cores: enough that workers blocked on Postgres I/O do not idle the CPU, low
;   enough that a thundering herd cannot swap the box. Raise this when the box grows cores,
;   not when a queue looks slow.
;
;   Worst-case memory is bounded by php.ini's memory_limit (512M), but that is a ceiling, not
;   an allocation — a real request peaks around 20 MB even with a 1.4MB payload decoded. 12 x
;   a realistic ~60 MB working set is ~720 MB, which fits the ~2.5 GB available with room for
;   Postgres to keep its cache.
;
; - pm = static. The old `dynamic` spends fork latency exactly when a burst arrives, which is
;   the worst possible moment. With a small, fixed pool the workers are already there.
;
; - pm.max_requests guards against slow leaks in long-lived workers without the churn of
;   recycling constantly.
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

pm = static
pm.max_children = 12
pm.max_requests = 500

; Surface a worker stuck past any sane request duration. Does not kill the request's own
; statement — that is what the DB-side lock_timeout in CompetitionRegistrationService is for —
; but it logs a backtrace, which is the difference between diagnosing a stall and guessing.
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2

catch_workers_output = yes
decorate_workers_output = no
clear_env = no
