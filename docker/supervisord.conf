[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:php-fpm]
command=php-fpm
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:crond]
command=crond -f -l 8
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Always-on consumer for the `registration` transport.
;
; The only Messenger worker not run from crond, and deliberately so. Every other queue tolerates
; up to 60s of pickup latency because nothing waits on it inside a user-visible window. This one
; is different in both directions: a club's squad is not stored until its message is handled, and
; CompetitionDrawService refuses to draw a competition with unstored submissions — so a cron-paced
; consumer would routinely stall the first round of a competition that just filled, for up to a
; minute, for no reason but scheduling.
;
; --time-limit recycles the worker hourly so a long-lived process cannot accumulate; supervisord
; restarts it immediately, which is the point of autorestart. --memory-limit is well under
; php.ini's 512M: these messages carry ~1.4MB envelopes, and a worker that has drained a burst of
; them should be recycled rather than trusted to have released everything.
;
; --limit is not set on purpose. The bound that matters is memory, and a count would stop a
; worker mid-burst for no reason.
[program:registration-consume]
command=php -d memory_limit=512M /var/www/html/bin/console messenger:consume registration --time-limit=3600 --memory-limit=256M --no-interaction -v
user=www-data
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
