# Production stack. TLS and host ports 80/443 are owned by the shared Caddy proxy
# (deploy/proxy/), which reaches this container by name over the external `web`
# network — this stack binds no host ports at all.

services:
  app:
    image: ghcr.io/cadesile/wunderkind-backend:prod
    container_name: wunderkind-prod
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      APP_URL: ${APP_URL}
      DEFAULT_URI: ${DEFAULT_URI}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES}
      DATABASE_URL: postgresql://wunderkind:${DB_PASSWORD}@postgres-prod:5432/wunderkind?serverVersion=16&charset=utf8
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      CLUB_STARTING_BALANCE: ${CLUB_STARTING_BALANCE}
      MAILER_DSN: ${MAILER_DSN}
      MAILER_FROM: ${MAILER_FROM}
      MAILER_FROM_NAME: ${MAILER_FROM_NAME}
      SOCIAL_TOKEN_ENCRYPTION_KEY: ${SOCIAL_TOKEN_ENCRYPTION_KEY}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      FACEBOOK_REDIRECT_URI: ${FACEBOOK_REDIRECT_URI}
      TWITTER_CLIENT_ID: ${TWITTER_CLIENT_ID}
      TWITTER_CLIENT_SECRET: ${TWITTER_CLIENT_SECRET}
      TWITTER_REDIRECT_URI: ${TWITTER_REDIRECT_URI}
    networks:
      - web
      - default
    depends_on:
      postgres-prod:
        condition: service_healthy

  postgres-prod:
    image: postgres:16-alpine
    container_name: postgres-prod
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      POSTGRES_USER: wunderkind
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: wunderkind
    volumes:
      - /mnt/volume-wkf/wunderkind/prod/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wunderkind"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Deliberately NOT on the `web` network — the database must not be reachable
    # from the proxy or from the dev stack.
    networks:
      - default

networks:
  web:
    external: true
